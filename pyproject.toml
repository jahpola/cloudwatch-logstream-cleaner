[project]
name = "cloudwatch-logstream-cleaner"
version = "0.1.0"
description = "A utility to delete CloudWatch log streams older than a specified number of days"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3==1.43.108",
    "boto3-stubs==1.43.108",
    "botocore==1.43.108",
]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
